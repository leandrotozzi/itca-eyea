name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build test (validates questions)
        run: python3 web/build/build.py
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r web/guia web/test-electricidad.html _site/
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=guia/"><link rel="canonical" href="guia/"><a href="guia/">Guía Visual</a>' > _site/index.html
          touch _site/.nojekyll
      # Pages en plan Free requiere repo público; en privado solo valida el build.
      # Con GitHub Pro: crear la variable de repo PAGES_ENABLED=true.
      - if: ${{ !github.event.repository.private || vars.PAGES_ENABLED == 'true' }}
        uses: actions/configure-pages@v5
      - if: ${{ !github.event.repository.private || vars.PAGES_ENABLED == 'true' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        if: ${{ !github.event.repository.private || vars.PAGES_ENABLED == 'true' }}
        uses: actions/deploy-pages@v4
